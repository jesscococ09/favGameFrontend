# Starter OpenAPI contract for CST 438 Project 02.
# Copy to docs/openapi.yaml in your repo, then replace Workout/Exercise with YOUR resources.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: FavGame API
  version: 1.0.0
  description: |
    API contract for FavGame API tracker.
    Users manage their game library, view and edit their games, and see staff recommendations.
    Authentication is handled through GitHub OAuth using Authorization Code + PKCE.
    Every error uses RFC 9457 Problem Details (see components/schemas/Problem).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 06
    url: https://github.com/jesscococ09/favGameBackend

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://your-api.example.com
    description: Production (replace in Sprint 3)

# Authentication is handled through GitHub OAuth.
# The resulting token is sent as a Bearer token to protected API endpoints.
security:
  - bearerAuth: []

tags:
  - name: Library
    description: A user's personal game library.
  - name: Users
    description: The signed-in user's own account.
  - name: Admin
    description: Admin-only user management.
  - name: Recommendations
    description: Admin-created game recommendations.

paths:

  /favGame/v1/users:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Retrieve signed-in user's profile information
      responses:
        '200':
          description: Signed-in user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Users]
      operationId: deleteMyAccount
      summary: Delete signed-in user's account and all associated data
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/users/name:
    patch:
      tags: [Users]
      operationId: updateUserName
      summary: Update signed-in user's display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamePatch'
      responses:
        '200':
          description: Display name updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/users/icon:
    patch:
      tags: [Users]
      operationId: updateUserIcon
      summary: Update signed-in user's icon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IconPatch'
      responses:
        '200':
          description: Icon updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/users/games:
    get:
      tags: [Library]
      operationId: listUserLibrary
      summary: List games in user's library
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Sort user's games by column
          schema:
            type: string
            enum:
              - alphabetical
              - rating
              - genre
              - gameName
            example: alphabetical
        - name: genre
          in: query
          description: Filter user's games by genre
          schema:
            type: string
            example: RPG
      responses:
        '200':
          description: One page of the user's library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Library]
      operationId: addGameToLibrary
      summary: Add a game to user's library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryEntryCreate'
      responses:
        '201':
          description: Game added to library
          headers:
            Location:
              description: URL of the new library entry
              schema:
                type: string
                example: /favGame/v1/users/games/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/users/games/search:
    get:
      tags: [Library]
      operationId: searchUserLibrary
      summary: Search user's games by name
      parameters:
        - name: query
          in: query
          required: true
          description: Game name or search text
          schema:
            type: string
            example: Zelda
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/users/games/{id}:
    parameters:
      - $ref: '#/components/parameters/LibraryEntryId'

    get:
      tags: [Library]
      operationId: getLibraryEntry
      summary: View a single game in user's library
      responses:
        '200':
          description: The library entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Library]
      operationId: updateLibraryEntry
      summary: Update rating or comment for a game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryEntryPatch'
      responses:
        '200':
          description: Library entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Library]
      operationId: deleteLibraryEntry
      summary: Remove a game from user's library
      responses:
        '204':
          description: Game removed from library
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/users/games/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/LibraryEntryId'

    post:
      tags: [Library]
      operationId: addGameComment
      summary: Add a comment to a game in user's library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '200':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/recommendations:
    get:
      tags: [Recommendations]
      operationId: listRecommendations
      summary: View admin-created game recommendations
      responses:
        '200':
          description: List of recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Admin]
      operationId: createRecommendation
      summary: Create a game recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationCreate'
      responses:
        '201':
          description: Recommendation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/recommendations/{id}:
    parameters:
      - $ref: '#/components/parameters/RecommendationId'

    patch:
      tags: [Admin]
      operationId: updateRecommendation
      summary: Update a game recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationPatch'
      responses:
        '200':
          description: Recommendation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Admin]
      operationId: deleteRecommendation
      summary: Delete a recommendation
      responses:
        '204':
          description: Recommendation deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/admin:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List all users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /favGame/v1/admin/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [Admin]
      operationId: getUser
      summary: View one user
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Admin]
      operationId: updateUserRole
      summary: Grant or revoke admin privileges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Delete a user and all their data
      responses:
        '204':
          description: User deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token used to access protected API endpoints.
        User authentication is handled through GitHub OAuth using
        Authorization Code + PKCE.

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    LibraryEntryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "10"

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: "12"

    RecommendationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "rec1"

  schemas:

    User:
      type: object
      required:
        - id
        - githubId
        - displayName
        - isAdmin
      properties:
        id:
          type: string
          example: "user123"
        githubId:
          type: string
          example: "123456789"
        displayName:
          type: string
          example: "JohnDoe123"
        iconUrl:
          type: string
          nullable: true
          example: "https://example.com/icon.png"
        isAdmin:
          type: boolean
          example: false

    UserPatch:
      description: Change user admin status.
      type: object
      required:
        - isAdmin
      properties:
        isAdmin:
          type: boolean
          example: true

    NamePatch:
      description: Body for PATCH /users/name.
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          example: "JohnDoe123"

    IconPatch:
      description: Body for PATCH /users/icon.
      type: object
      required:
        - iconUrl
      properties:
        iconUrl:
          type: string
          example: "https://example.com/icon.png"

    UserPage:
      type: object
      required:
        - content
        - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    Game:
      type: object
      required:
        - id
        - gameName
        - genre
        - platform
      properties:
        id:
          type: string
          example: "zelda12"
        thumbnail:
          type: string
          example: "https://imageOfGame.com/zelda.png"
        gameName:
          type: string
          example: "The Legend of Zelda"
        gameDescription:
          type: string
          example: "Follow Link along his adventure..."
        platform:
          type: string
          example: "Switch"
        genre:
          type: string
          example: "Adventure"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "Loved this game!"

    LibraryEntry:
      type: object
      required:
        - id
        - userId
        - gameId
      properties:
        id:
          type: string
          example: "10"
        userId:
          type: string
          example: "user123"
        gameId:
          type: string
          example: "zelda12"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "Loved this game!"

    LibraryEntryCreate:
      description: Body for POST /users/games.
      type: object
      required:
        - gameId
      properties:
        gameId:
          type: string
          example: "zelda12"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "Loved this game!"

    LibraryEntryPatch:
      description: Body for PATCH /users/games/{id}.
      type: object
      minProperties: 1
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "Loved this game!"

    LibraryEntryPage:
      type: object
      required:
        - content
        - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/LibraryEntry'
        page:
          $ref: '#/components/schemas/PageMeta'

    CommentCreate:
      description: Body for POST /users/games/{id}/comments.
      type: object
      required:
        - comment
      properties:
        comment:
          type: string
          example: "Loved this game!"

    Recommendation:
      type: object
      required:
        - id
        - thumbnail
        - gameName
        - gameDescription
        - platform
        - genre
        - rating
        - comment
      properties:
        id:
          type: string
          example: "rec1"
        thumbnail:
          type: string
          example: "https://imageOfGame.com/zelda.png"
        gameName:
          type: string
          example: "The Legend of Zelda"
        gameDescription:
          type: string
          example: "Follow Link along his adventure..."
        platform:
          type: string
          example: "Switch"
        genre:
          type: string
          example: "Adventure"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "The admin recommends this game!"

    RecommendationCreate:
      description: Body for POST /recommendations.
      type: object
      required:
        - thumbnail
        - gameName
        - gameDescription
        - platform
        - genre
        - rating
        - comment
      properties:
        thumbnail:
          type: string
          example: "https://imageOfGame.com/zelda.png"
        gameName:
          type: string
          example: "The Legend of Zelda"
        gameDescription:
          type: string
          example: "Follow Link along his adventure..."
        platform:
          type: string
          example: "Switch"
        genre:
          type: string
          example: "Adventure"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "The admin recommends this game!"

    RecommendationPatch:
      description: Body for PATCH /recommendations/{id}.
      type: object
      minProperties: 1
      properties:
        thumbnail:
          type: string
          example: "https://imageOfGame.com/zelda.png"
        gameName:
          type: string
          example: "The Legend of Zelda"
        gameDescription:
          type: string
          example: "Follow Link along his adventure..."
        platform:
          type: string
          example: "Switch"
        genre:
          type: string
          example: "Adventure"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "Updated recommendation comment."

    RecommendationPage:
      type: object
      required:
        - content
        - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        page:
          $ref: '#/components/schemas/PageMeta'

    PageMeta:
      description: |
        Spring Data's paginated response metadata.
      type: object
      required:
        - size
        - number
        - totalElements
        - totalPages
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3

    Problem:
      description: RFC 9457 Problem Details.
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Game not found
        instance:
          type: string
          example: /favGame/v1/users/games/zelda1234

  responses:

    BadRequest:
      description: Validation failed or malformed JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation.

    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
            detail: Authentication is required.

    Forbidden:
      description: Valid token, but the user is not allowed to perform the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
            detail: Admin privileges are required.

    NotFound:
      description: Requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Resource not found.

    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
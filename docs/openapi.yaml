# Starter OpenAPI contract for CST 438 Project 02.
# Copy to docs/openapi.yaml in your repo, then replace Workout/Exercise with YOUR resources.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: FavGame API
  version: 1.0.0
  description: |
    API contract for FavGame API tracker. 
    Users manage their game library, view and edit their games and see staff recommendations. 
    Every error uses RFC 9457 Problem Details (see components/schemas/Problem).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 06
    url: https://github.com/jesscococ09/favGameBackend

servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://your-api.example.com
    description: Production (replace in Sprint 3)

# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Public authentication endpoints
  - name: Library
    description: A user's personal game library entry.
  - name: Games
    description: A user's own game.
  - name: Users
    description: The signed-in user's own account
  - name: Admin
    description: Admin-only user management
  - name: Recommendations
    description: Admin creates games recommendations

paths:
  /favGame/v1/users/games:
    get:
      tags: [Library]
      operationId: listUserLibrary
      summary: List games in user's library (paginated, sortable, filterable, searchable)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Sort user's games by column
          schema:
            type: string
            enum: ['alphabetical','rating','genre','gameName']
            example: alphabetical
        - name: genre
          in: query
          description: Filter user's games by genre
          schema:
            type: string
            example: RPG
        - name: query
          in: query
          description: Search user's game by name
          schema:
            type: string
            example: Zelda
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: One page of the user's library entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Library]
      operationId: addGameToLibrary
      summary: Add game to user's library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryEntryCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Created. POST is not idempotent; two calls make two entries.
          headers:
            Location:
              description: URL of the new library entry
              schema:
                type: string
                example: /favGame/v1/users/games/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favGame/v1/games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'

    get:
      tags: [Games]
      operationId: getGame
      summary: View game information
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: The game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /favGame/v1/games:
    get:
      tags: [Games]
      operationId: listGames
      summary: List available games (paginated)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of available games
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favGame/v1/auth/register:
    post:
      tags: [Auth]
      security: []
      operationId: registerUser
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisters'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /favGame/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: loginUser
      summary: Authenticate user and return JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favGame/v1/users/games/{id}:
    parameters:
      - $ref: '#/components/parameters/LibraryEntryId'

    get:
      tags: [Library]
      operationId: getLibraryEntry
      summary: View a single game in user's library
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The library entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Library]
      operationId: replaceLibraryEntry
      summary: Change all fields of library entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryEntryCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Replace library entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Library]
      operationId: updateLibraryEntry
      summary: Change some fields of library entry (rating, comment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryEntryPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Update library entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Library]
      operationId: deleteLibraryEntry
      summary: Delete a game from the user's library
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /favGame/v1/users:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Retrieves Users profile info
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Signed in user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
        tags: [Users]
        operationId: deleteMyAccount
        summary: Deletes users account
        responses:
          '500':
            $ref: '#/components/responses/InternalError'
          '204':
            description: Delete
          '401':
            $ref: '#/components/responses/Unauthorized'
  /favGame/v1/users/password:
    patch:
      tags: [Users]
      operationId: updatePassword
      summary: Update user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favGame/v1/users/icon:
    patch:
      tags: [Users]
      operationId: updateUserIcon
      summary: Update user icon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IconPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Icon updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favGame/v1/users/games/search:
    get:
      tags: [Library]
      operationId: searchUserLibrary
      summary: Search user's game by name
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favGame/v1/recommendations:
    get:
      tags: [ Recommendations ]
      operationId: listRecommendations
      summary: View admin created game recommendations
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: List of recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [ Admin ]
      operationId: createRecommendation
      summary: Create a game recommendation (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Recommendation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /favGame/v1/recommendations/{id}:
    parameters:
      - $ref: '#/components/parameters/RecommendationId'

    delete:
      tags: [Admin]
      operationId: deleteRecommendations
      summary: Delete a recommendation (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /favGame/v1/admin/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [ Admin ]
      operationId: getUser
      summary: View one user (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [ Admin ]
      operationId: updateUserRole
      summary: Granting or revoking admin (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [ Admin ]
      operationId: deleteUser
      summary: Delete User and data (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /favGame/v1/admin:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List all users (admin only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the OAuth2 Authorization Code + PKCE flow (with Google, send the ID token; Google's access_token is opaque).

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    GameId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "zelda12"
    LibraryEntryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "1"
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: "12"
    RecommendationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "rec1"
  schemas:
    User:
      type: object
      required: [userId,displayName, isAdmin]
      properties:
        userId:
          type: string
          example: "12"
        displayName:
          type: string
          example: "JohnDoe123"
        isAdmin:
          type: boolean
          example: false
        icon:
          type: string
          nullable: true
          example: "icon.png"
    UserPatch:
      description: Change user role (admin only)
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
          example: true
    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'
    PasswordPatch:
      description: Body for PATCH. /user/password
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          example: "user1234"
        newPassword:
          type: string
          example: "newUser1234"
    IconPatch:
      description: Body for PATCH /users/icon
      type: object
      required: [icon]
      properties:
        icon:
          type: string
          example: "icons.png"
    Game:
      type: object
      required: [gameId, gameName, genre]
      properties:
        gameId:
          type: string
          example: "zelda12"
        thumbnail:
          type: string
          example: "https://imageOfGame.com/zelda.png"
        gameName:
          type: string
          example: "The Legend of Zelda"
        gameDescription:
          type: string
          example: "Follow link along..."
        platform:
          type: string
          example: "Switch"
        genre:
          type: string
          example: "Adventure"
    GamePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        page:
          $ref: '#/components/schemas/PageMeta'
    LibraryEntry:
      type: object
      required: [entryId, userId, gameId]
      properties:
        entryId:
          type: string
          example: "10"
        userId:
          type: string
          example: "user2"
        gameId:
          type: string
          example: "zelda12"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "loved this games!!!"
    LibraryEntryCreate:
      description: Body for POST /users/games
      type: object
      required: [gameId]
      properties:
        gameId:
          type: string
          example: "zelda12"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "loved this games!!!"
    LibraryEntryPatch:
      description: Body for PATCH /users/games/{id}
      type: object
      minProperties: 1
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        comment:
          type: string
          example: "loved this games!!!"
    LibraryEntryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/LibraryEntry'
        page:
          $ref: '#/components/schemas/PageMeta'
    Recommendation:
      type: object
      required: [recommendationId, adminId, gameId]
      properties:
        recommendationId:
          type: string
          example: "3"
        adminId:
          type: string
          example: "admin1234"
        gameId:
          type: string
          example: "zelda12"
        comment:
          type: string
          example: "loved this games!!!"
    RecommendationCreate:
      description: Body for POST /recommendations
      type: object
      required: [gameId, comment]
      properties:
        gameId:
          type: string
          example: "zelda12"
        comment:
          type: string
          example: "loved this games!!!"
    RecommendationPage:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        page:
          $ref: '#/components/schemas/PageMeta'
    AuthRegisters:
      type: object
      required: [displayName, password]
      properties:
        displayName:
          type: string
          example: "JohnDoe1234"
        password:
          type: string
          example: "superSecretePass1234"
    AuthLogin:
      type: object
      required: [ displayName, password ]
      properties:
        displayName:
          type: string
          example: "JohnDoe1234"
        password:
          type: string
          example: "superSecretePass1234"
    AuthToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    PageMeta:
      description: >-
        Spring Data's PagedModel shape. Turn it on with
        spring.data.web.pageable.serialization-mode=via_dto in application.properties.
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3
    Problem:
      description: RFC 9457 Problem Details. The ONE error body every endpoint returns.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Game not found
        instance:
          type: string
          example: /favGame/v1/games/zelda1234

  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but not allowed (for example, not an admin)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: Doesn't exist, or belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Game 42 not found
    InternalError:
      description: Unexpected server error. Your app still needs to show something useful.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500